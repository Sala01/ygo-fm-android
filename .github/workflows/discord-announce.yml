name: Announce release on Discord

# Lives in the PUBLIC repo (Sala01/ygo-fm-android). Posts one existing
# release to Discord. The private repo's release workflow starts it right
# after it publishes a release; by hand: Actions -> this workflow -> Run
# workflow, or `gh workflow run discord-announce.yml -f tag=v0.1.0-alpha.1`.
# (GitHub's own "release published" trigger did not start it here, so it is
# not used: that would also announce every release twice once it did.)
#
# Needs one repo secret: DISCORD_WEBHOOK_URL (Discord: Channel settings ->
# Integrations -> Webhooks -> New webhook -> Copy webhook URL). Without it the
# job just skips.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce (e.g. v0.1.0-alpha.1)
        required: true

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ github.event.release.name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping."
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Read the release as data; nothing from it is spliced into the script.
            json=$(gh release view "$INPUT_TAG" --json tagName,name,url,body,isPrerelease)
            TAG=$(jq -r .tagName <<<"$json")
            NAME=$(jq -r .name <<<"$json")
            URL=$(jq -r .url <<<"$json")
            BODY=$(jq -r .body <<<"$json")
            PRERELEASE=$(jq -r .isPrerelease <<<"$json")
          fi
          kind="New Android build"
          [ "$PRERELEASE" = "true" ] && kind="New Android pre-release"
          # Values go through jq as data, never spliced into the script, so a
          # release body cannot inject anything. Discord limits an embed
          # description to 4096 characters.
          payload=$(jq -n \
            --arg title "$kind: ${NAME:-$TAG}" \
            --arg url "$URL" \
            --arg body "${BODY:0:1500}" \
            '{embeds: [{title: $title, url: $url, description: $body, color: 5793266}]}')
          curl -sS -f -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"
